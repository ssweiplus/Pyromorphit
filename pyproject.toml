[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyromorphit"
version = "0.2.0"
description = "Host-agent-native capability and evidence surface for Microsoft PyRIT"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [{name = "Pyromorphit contributors"}]
dependencies = []

[project.optional-dependencies]
pyrit = [
  "pyrit @ git+https://github.com/microsoft/PyRIT.git@f9bcd1dd59dd9b5225fb9da8172faef3b84ceed9",
]
dev = [
  "pytest>=8",
]

[project.scripts]
pyromorphit = "pyromorphit.cli:main"

[tool.setuptools.packages.find]
include = ["pyromorphit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
