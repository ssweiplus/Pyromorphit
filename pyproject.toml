[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyromorphit"
version = "0.1.0"
description = "Human-in-the-loop red-team reasoning framework for Agent security testing"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pyromorphit = "pyromorphit.cli:main"

[tool.setuptools.packages.find]
include = ["pyromorphit*"]
